<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Image needed placeholder</title>
  <desc id="desc">Neutral gray placeholder for project images that still need source media.</desc>
  <rect width="1200" height="800" fill="#ededeb"/>
  <g stroke="#d2d2cf" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800"/>
  </g>
  <rect x="340" y="255" width="520" height="290" fill="none" stroke="#b9b9b5" stroke-width="2"/>
  <path d="M390 495l135-140 105 95 75-68 105 113" fill="none" stroke="#b9b9b5" stroke-width="2"/>
  <circle cx="730" cy="330" r="32" fill="none" stroke="#b9b9b5" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#777771" text-anchor="middle">
    <text x="600" y="610" font-size="18" font-weight="700">IMAGE / DIAGRAM NEEDED</text>
    <text x="600" y="642" font-size="13">replace with project screenshot, process diagram, demo still, or output frame</text>
  </g>
